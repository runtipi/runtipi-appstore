services:
  bitmagnet:
    image: 'ghcr.io/bitmagnet-io/bitmagnet:v0.10.1'
    command:
      - 'worker'
      - 'run'
      - '--keys=http_server'
      - '--keys=queue_server'
      - '--keys=dht_crawler'
    ports:
      - '3334:3334/tcp'
      - '3334:3334/udp'
    environment:
      - 'POSTGRES_HOST=bitmagnet-db'
      - 'POSTGRES_NAME=bitmagnet'
      - 'POSTGRES_USER=tipi'
      - 'POSTGRES_PASSWORD=${BITMAGNENT_DB_PASSWORD}'
      - 'REDIS_ADDR=bitmagnet-redis:6379'
    depends_on:
      bitmagnet-db:
        condition: 'service_healthy'
      bitmagnet-redis:
        condition: 'service_started'
    x-runtipi:
      internal_port: 3333
      is_main: true
  bitmagnet-db:
    image: 'postgres:17-alpine'
    volumes:
      - '${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_PASSWORD=${BITMAGNENT_DB_PASSWORD}'
      - 'POSTGRES_USER=tipi'
      - 'POSTGRES_DB=bitmagnet'
    healthcheck:
      test: 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}'
      interval: '30s'
      timeout: '5s'
      retries: 5
      start_period: '20s'
  bitmagnet-redis:
    image: 'redis:alpine'
    command: '--save 60 1 --loglevel warning'
    volumes:
      - '${APP_DATA_DIR}/data/redis:/data'
    healthcheck:
      test: 'redis-cli ping | grep PONG'
      interval: '30s'
      timeout: '3s'
      retries: 5
      start_period: '20s'
x-runtipi:
  schema_version: 2
