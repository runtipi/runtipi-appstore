x-runtipi:
  schema_version: 2
services:
  wiki-js:
    image: ghcr.io/requarks/wiki:3.3.1
    x-runtipi:
      internal_port: 3000
      is_main: true
    depends_on:
      - wiki-js-db
    environment:
      ADMIN_EMAIL: ${WIKI_JS_ADMIN_EMAIL}
      ADMIN_PASS: ${WIKI_JS_ADMIN_PASSWORD}
      DB_TYPE: postgres
      DB_HOST: wiki-js-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${WIKI_JS_DB_PASS}
      DB_NAME: wiki
  wiki-js-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKI_JS_DB_PASS}
      POSTGRES_USER: wikijs
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
